<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E9CC"/>
      <stop offset="1" stop-color="#EBCF9C"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6440"/>
      <stop offset="1" stop-color="#6E4228"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="suncircle"><circle cx="512" cy="500" r="300"/></clipPath>
    <clipPath id="sunclip">
      <!-- Sonne mit 70er-Streifenlücken unten -->
      <rect x="0" y="0" width="1024" height="420"/>
      <rect x="0" y="436" width="1024" height="34"/>
      <rect x="0" y="484" width="1024" height="26"/>
      <rect x="0" y="522" width="1024" height="20"/>
      <rect x="0" y="552" width="1024" height="14"/>
    </clipPath>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A3330"/>
      <stop offset="1" stop-color="#1E1A18"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3B2414" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Grundfläche -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- Retro-Sonne -->
    <g clip-path="url(#sunclip)"><g clip-path="url(#suncircle)">
      <rect x="200" y="190" width="624" height="120" fill="#E9B63B"/>
      <rect x="200" y="310" width="624" height="80" fill="#EE9A35"/>
      <rect x="200" y="390" width="624" height="80" fill="#E8772E"/>
      <rect x="200" y="470" width="624" height="340" fill="#CF4B2E"/>
    </g></g>

    <!-- Boden-Streifen -->
    <rect x="100" y="790" width="824" height="140" fill="#5B3A29"/>
    <rect x="100" y="770" width="824" height="14" fill="#CF4B2E"/>
    <rect x="100" y="748" width="824" height="12" fill="#E8772E"/>
    <rect x="100" y="728" width="824" height="10" fill="#E9B63B"/>
  </g>

  <!-- Schallplatten in der Kiste (hinten nach vorne) -->
  <g>
    <circle cx="380" cy="600" r="165" fill="url(#vinyl)"/>
    <circle cx="380" cy="600" r="150" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="380" cy="600" r="125" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="380" cy="600" r="55" fill="#2F7F7A"/>
    <circle cx="380" cy="600" r="8" fill="#1E1A18"/>

    <circle cx="650" cy="610" r="160" fill="url(#vinyl)"/>
    <circle cx="650" cy="610" r="145" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="650" cy="610" r="118" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="650" cy="610" r="54" fill="#E9B63B"/>
    <circle cx="650" cy="610" r="8" fill="#1E1A18"/>
  </g>

  <!-- Register-Reiter A / M / Z -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" font-size="64" text-anchor="middle">
    <rect x="232" y="560" width="96" height="120" rx="18" fill="#CF4B2E" stroke="#5B3A29" stroke-width="6"/>
    <text x="280" y="625" fill="#F7E9CC">A</text>
    <rect x="466" y="530" width="96" height="150" rx="18" fill="#2F7F7A" stroke="#5B3A29" stroke-width="6"/>
    <text x="514" y="595" fill="#F7E9CC">M</text>
    <rect x="700" y="575" width="96" height="110" rx="18" fill="#E9B63B" stroke="#5B3A29" stroke-width="6"/>
    <text x="748" y="640" fill="#5B3A29">Z</text>
  </g>

  <!-- Bewegungsstriche: Platte wird einsortiert -->
  <g stroke="#5B3A29" stroke-width="14" stroke-linecap="round">
    <line x1="300" y1="200" x2="300" y2="280"/>
    <line x1="260" y1="250" x2="260" y2="300"/>
    <line x1="740" y1="200" x2="740" y2="280"/>
    <line x1="780" y1="250" x2="780" y2="300"/>
  </g>

  <!-- Platte, die gerade einsortiert wird -->
  <g transform="rotate(-8 520 330)">
    <circle cx="520" cy="330" r="150" fill="url(#vinyl)" stroke="#F7E9CC" stroke-width="8"/>
    <circle cx="520" cy="330" r="132" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="520" cy="330" r="105" fill="none" stroke="#4A423E" stroke-width="3"/>
    <circle cx="520" cy="330" r="50" fill="#E8772E"/>
    <circle cx="520" cy="330" r="7" fill="#1E1A18"/>
  </g>

  <!-- Holzkiste (Vorderseite) -->
  <g>
    <path d="M 200 650 L 824 650 L 800 880 L 224 880 Z" fill="url(#wood)" stroke="#4A2C1B" stroke-width="8" stroke-linejoin="round"/>
    <line x1="208" y1="726" x2="816" y2="726" stroke="#4A2C1B" stroke-width="5" opacity="0.6"/>
    <line x1="216" y1="803" x2="808" y2="803" stroke="#4A2C1B" stroke-width="5" opacity="0.6"/>
    <rect x="432" y="680" width="160" height="34" rx="17" fill="#3B2414"/>
    <!-- Etikett -->
    <rect x="392" y="752" width="240" height="96" rx="10" fill="#F7E9CC" stroke="#4A2C1B" stroke-width="5"/>
    <g stroke="#5B3A29" stroke-width="10" stroke-linecap="round">
      <line x1="420" y1="778" x2="604" y2="778"/>
      <line x1="420" y1="800" x2="560" y2="800"/>
      <line x1="420" y1="822" x2="520" y2="822"/>
    </g>
  </g>
</svg>
