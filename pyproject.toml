[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musiclib-organizer"
version = "0.2.0"
description = "Musikbibliothek mit Beatport-Metadaten taggen, zu MP3 320 kbit/s konvertieren und sortieren"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "mutagen>=1.47",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
musiclib-organizer = "musiclib.gui:main"

[tool.setuptools]
packages = ["musiclib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: benötigt Beatport-Zugangsdaten und Netzwerk"]
