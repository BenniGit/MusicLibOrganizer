[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musiclib-organizer"
version = "0.8.0"
description = "Musikbibliothek mit Beatport-Metadaten taggen, zu MP3 320 kbit/s konvertieren und sortieren"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "mutagen>=1.47",
    "PySide6>=6.6",
    "numpy>=1.24",
    "keyring>=24",
    "pyrekordbox>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ki = ["essentia-tensorflow"]  # KI-Analyse für musiclib-energie --ki (macOS 15+, Linux)

[project.scripts]
musiclib-energie = "musiclib.energy_cli:main"
musiclib-rekordbox = "musiclib.rekordbox_cli:main"
musiclib-pruefen = "musiclib.audit_cli:main"

[project.gui-scripts]
musiclib-organizer = "musiclib.gui:main"

[tool.setuptools]
packages = ["musiclib"]

[tool.setuptools.package-data]
musiclib = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: benötigt Beatport-Zugangsdaten und Netzwerk"]
